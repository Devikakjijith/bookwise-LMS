{% extends "base.html" %}
{% block title %}Admin Login — Bookwise Library{% endblock %}

{% block content %}
<div class="page-heading">
  <h1>Admin sign in</h1>
  <p>Librarian access — manage books, issues, returns, and view library-wide stats.</p>
</div>

<div class="card" style="max-width: 420px;">
  <form method="POST" action="{{ url_for('admin_login') }}" autocomplete="off">
    <input type="text" name="fake_username" style="display:none" tabindex="-1" autocomplete="off">
    <input type="password" name="fake_password" style="display:none" tabindex="-1" autocomplete="off">

    <div class="form-group">
      <label for="email">Admin email</label>
      <input type="email" id="email" name="email" required autocomplete="off" placeholder="Email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="off" placeholder="Password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
  </form>
  <p class="hint" style="margin-top:1rem;">
    <a href="{{ url_for('home') }}">&larr; Back to member sign in</a>
  </p>
</div>
{% endblock %}
